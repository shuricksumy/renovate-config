name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          for f in default.json no-automerge.json; do
            npx --yes --package renovate@44 renovate-config-validator --strict "$f"
          done
